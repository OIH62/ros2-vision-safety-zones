name: ROS 2 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            image: ros:humble-ros-base
          - ros_distro: jazzy
            image: ros:jazzy-ros-base
          - ros_distro: kilted
            image: ros:kilted-ros-base
          - ros_distro: lyrical
            image: ros:lyrical-ros-base
          - ros_distro: rolling
            image: ros:rolling-ros-base
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools and ROS dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-pip python3-pytest \
            python3-rosdep python3-venv
          rosdep update
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          rosdep install --from-paths src --ignore-src -r -y \
            --rosdistro "${ROS_DISTRO}"
      - name: Build
        shell: bash
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          python3 -m colcon build --event-handlers console_direct+
      - name: Validate runtime environment
        shell: bash
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          bash -n setup.sh run_letmc.sh monitor_state.sh monitor_xyz.sh \
            scripts/ros_env.sh
          bash -u -c '
            source scripts/ros_env.sh
            source_ros_file "$PWD/install/setup.bash"
            case $- in
              *u*) ;;
              *) echo "nounset was not restored" >&2; exit 1 ;;
            esac
            ros2 pkg prefix person_pose
            ros2 pkg prefix person_zone_cpp
          '
          entrypoint=install/person_pose/lib/person_pose/pose_publisher
          entrypoint_python="$(head -n 1 "$entrypoint" | sed 's/^#!//')"
          test "$(readlink -f "$entrypoint_python")" = \
            "$(readlink -f "$(command -v python3)")"
          rosdep check --from-paths src --ignore-src \
            --rosdistro "${ROS_DISTRO}"
      - name: Test
        shell: bash
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          source install/setup.bash
          colcon test --packages-select person_zone_cpp \
            --event-handlers console_direct+
          colcon test-result --verbose
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src/person_pose \
            python3 -m pytest -q src/person_pose/test
